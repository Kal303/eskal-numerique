<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site Libre</title>
    <style>
        body {
            background-color: #1a237e; /* Fond bleu nuit profond */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Ton cadre arrondi fluide */
        .cadre-arrondi {
            background-color: #6C7E89; /* Ton gris ardoise éclairci (RGB 108, 126, 137) */
            border-radius: 20px;       /* Des bords bien arrondis et doux */
            padding: 30px;
            max-width: 600px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        h1 {
            color: #e0f7fa; /* Bleu très clair lumineux */
            margin-top: 0;
        }

        p {
            color: #e0f7fa; /* Texte en bleu clair pour une lisibilité parfaite */
            font-size: 1.1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="cadre-arrondi">
        <h1>Bienvenue sur ma page !</h1>
        <p>Fini les galères de blocage ! Ici, le code source est 100 % libre, le cadre est parfaitement arrondi et le texte bleu clair s'affiche avec une fluidité totale.</p>
    </div>

</body>
</html>
